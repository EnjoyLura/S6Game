<section id="s6-boot" aria-label="游戏加载" aria-busy="true">
  <div class="boot-frame">
    <img class="boot-forest" data-boot-art="boot/art/forest.webp" alt="">
    <div class="boot-shade"></div>
    <header class="boot-title"><span class="boot-star" aria-hidden="true">✦</span><h1>挂机传说</h1><p><i></i>无尽征途<i></i></p></header>
    <div class="boot-party" aria-hidden="true">
      <span class="boot-hero boot-mage"><img data-boot-art="boot/art/mage.webp" alt=""></span>
      <span class="boot-hero boot-priest"><img data-boot-art="boot/art/priest.webp" alt=""></span>
      <span class="boot-hero boot-knight"><img data-boot-art="boot/art/knight.webp" alt=""></span>
    </div>
    <div class="boot-bottom">
      <p class="boot-tagline">三位伙伴，一段无尽的冒险</p>
      <div class="boot-progress-copy"><span id="boot-status" role="status">正在准备冒险…</span><b id="boot-percent">0%</b></div>
      <div id="boot-progress" role="progressbar" aria-label="游戏加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="boot-fill"></span></div>
      <p id="boot-detail">首次进入需加载美术资源</p>
      <button id="boot-retry" type="button" hidden>重新加载</button>
      <p class="boot-note">加载完成后自动进入游戏</p>
    </div>
  </div>
</section>
<noscript><div style="position:fixed;inset:0;z-index:100001;background:#fff0d8;color:#623719;display:grid;place-items:center">请开启 JavaScript 后进入游戏。</div></noscript>
